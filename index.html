    --line: #e6ded0;
    --accent: #b4442c;

  @media (prefers-color-scheme: dark) {

      --bg: #16150f;

      --text: #f0ece3;

  body {
    margin: 0;

    background: var(--bg);

  .app { font-size: 15px; color: var(--accent); font-weight: 600; letter-spacing: .02em; }
  h1 { font-size: 30px; line-height: 1.2; margin: 8px 0 10px; }
  .updated { font-size: 14px; color: var(--muted); margin: 0; }
  h2 { font-size: 20px; margin: 34px 0 10px; }
  p, li { margin: 0 0 14px; }
  ul { padding-left: 22px; }
  strong { font-weight: 600; }
  a { color: var(--accent); }
  a:hover { text-decoration: none; }
  code {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 15px;
    word-break: break-all;
  }
  table { border-collapse: collapse; width: 100%; margin: 0 0 18px; font-size: 16px; }
  th, td { border: 1px solid var(--line); padding: 9px 11px; text-align: left; vertical-align: top; }
  th { background: var(--surface); font-weight: 600; }
  .note {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 24px;
  }
  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 15px;
    color: var(--muted);
  }
  footer a { margin-right: 18px; }
</style>
